<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant101</title>
    <link rel="stylesheet" href="styleC.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <div class="nav_header">
        <div class="logo nav_logo">
          <a href="#">Restaurant <span> 101</span></a>
        </div>
        <!-- <nav_menu_btn id="nav_menu_btn"><i class="bi bi-list"></i></nav_menu_btn>-->
      </div>
      <ul class="nav_links" id="navlinks">
        <li><a href="#">Home</a></li>
        <li><a href="#">Special</a></li>
        <li><a href="#">Chef</a></li>
        <li><a href="#">Client</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
      <div class="nav_btn">
        <button class="btn">
          <i class="bi bi-bag-fill"></i>
        </button>
      </div>
    </nav>
    <!-- Hero section-->
    <section class="hero">
      <div class="contact">
        <h1>Contact Us</h1>
        <p>
          Tel: 071 868 3001 <br />
          Email: darikf@gmail.com <br />
          11 las vegas Cresc, Cosmo City <br />
          2188, Johannesburg <br />
          Gps : -26.017779, 27.93764
        </p>
      </div>
      <div class="contactUs">
        <img src="reastuarant.jpg" alt="ReataurantImage" />
      </div>
    </section>
    <!--Contact Section-->
    <section class="contactForm">
      <div class="contact_form">
        <form>
          <div class="name mb-2">
            <label for="name" class="label">Name</label>
            <input type="text" class="form-control" placeholder="Your Name" />
          </div>
          <div class="email mb-2">
            <label for="email" class="label">Email Address</label>
            <input
              type="email mb-2"
              class="form-control"
              placeholder="you@example.com"
            />
          </div>
          <div class="message mb-4">
            <label for="message" class="label">Message</label>
            <textarea
              name=""
              rows="2"
              id=""
              class="form-control"
              placeholder="How can we help?"
            >
            </textarea>
          </div>
          <button type="submit" class="btn btn-primary mt-1">Submit</button>
        </form>
      </div>
      <div class="getInTouch">
        <h1>Get in touch</h1>

        <p>Open Sunday-Saturdays 9am to 9pm</p>

        <button class="btn btn-primary">Get an instant Quote</button>
      </div>
    </section>

    <div class="sitemap">
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d57367.70889474112!2d27.93660525181065!3d-26.017787140050498!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e95763b446f384b%3A0xa5ca00d9845a6986!2s11%20Las%20Vegas%20Cres%2C%20Cosmo%20City%2C%20Roodepoort%2C%202188!5e0!3m2!1sen!2sza!4v1763982405546!5m2!1sen!2sza"
        width="100%"
        height="30vh"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
  </body>
</html>
